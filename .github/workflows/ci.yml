name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Format
        run: ruff format --check src tests examples
      - name: Types
        run: mypy
      - name: Tests
        run: pytest --cov=esib --cov-report=term-missing --cov-fail-under=90
      - name: Demo transcript is unchanged
        run: |
          python -m esib demo > /tmp/demo.txt
          diff -u demo-output.txt /tmp/demo.txt
      - name: Examples run offline
        run: |
          python examples/index_csv_catalog.py
          python examples/zero_downtime_rebuild.py

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/esib --version
      - name: Run the installed package from a neutral directory
        working-directory: /tmp
        run: |
          /tmp/venv/bin/esib demo > /tmp/demo-from-wheel.txt
          diff -u "$GITHUB_WORKSPACE/demo-output.txt" /tmp/demo-from-wheel.txt
      - name: Import the public surface from the wheel
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python - <<'PY'
          import esib
          from esib import Client, Config, IndexManager, infer_mappings, scan
          from esib.testing import FakeCluster

          assert esib.__version__
          assert len(esib.__all__) >= 40
          print("public surface imports cleanly from the wheel")
          PY
